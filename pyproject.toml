[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iunets"
version = "0.2.0"
description = "Invertible U-Nets with memory efficient gradient reconstruction"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Christian Etmann"}]
keywords = ["invertible", "u-net", "pytorch", "segmentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.3"]

[project.optional-dependencies]
docs = ["sphinx>=7", "furo>=2024.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

# Contributor and CI installs use CPU wheels on x86-64 Linux. This source
# setting is uv-only; published package metadata keeps torch>=2.3 portable.
[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["iunets*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
